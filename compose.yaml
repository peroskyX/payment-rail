name: railbridge

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: railbridge
      POSTGRES_USER: railbridge
      POSTGRES_PASSWORD: railbridge
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U railbridge -d railbridge']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - railbridge-postgres:/var/lib/postgresql

volumes:
  railbridge-postgres:
